name: Deploy to GitHub Pages

# Vercel does not need this workflow: connect the repo at vercel.com once and
# every push to main deploys automatically using vercel.json.
# This workflow gives you the same push-to-deploy on GitHub Pages for free.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check scripts
        run: |
          node --check projectsData.js
          node --check app.js
          node --check tailwind.config.js

      - name: Validate projectsData.js shape
        run: |
          node -e '
            const vm = require("vm");
            const fs = require("fs");
            const ctx = {};
            vm.runInNewContext(fs.readFileSync("projectsData.js", "utf8") + ";this.projects = projects; this.siteConfig = siteConfig;", ctx);
            const { projects, siteConfig } = ctx;
            if (!Array.isArray(projects) || projects.length === 0) throw new Error("projects must be a non-empty array");
            for (const p of projects) {
              for (const k of ["id", "title", "demoType", "demoUrl", "githubUrl", "tags"]) {
                if (p[k] === undefined) throw new Error(`project ${p.id || "?"} missing ${k}`);
              }
              if (!["video", "gif"].includes(p.demoType)) throw new Error(`project ${p.id}: demoType must be video|gif`);
            }
            if (!siteConfig?.name) throw new Error("siteConfig.name is required");
            console.log(`OK: ${projects.length} projects, site for ${siteConfig.name}`);
          '

      - name: Warn about missing demo media
        run: |
          node -e '
            const vm = require("vm"); const fs = require("fs");
            const ctx = {}; vm.runInNewContext(fs.readFileSync("projectsData.js","utf8") + ";this.projects = projects;", ctx);
            let missing = 0;
            for (const p of ctx.projects) for (const u of [p.demoUrl, p.posterUrl]) {
              if (u && u.startsWith("./") && !fs.existsSync(u)) { console.log(`::warning::${p.id}: ${u} not found (placeholder will be shown)`); missing++; }
            }
            console.log(missing ? `${missing} media file(s) missing` : "All referenced media present");
          '

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
