name: Deploy to GitHub Pages

# Vercel does not need this workflow: connect the repo at vercel.com once and
# every push to main deploys automatically using vercel.json.
# This workflow gives you the same push-to-deploy on GitHub Pages for free.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check scripts
        run: |
          node --check main.js
          node --check theme.js

      - name: Validate write-ups and community data
        run: |
          node -e '
            const fs = require("fs");
            const iso = /^\d{4}-\d{2}(-\d{2})?$/;
            const check = (file, required) => {
              const data = JSON.parse(fs.readFileSync(file, "utf8"));
              if (!Array.isArray(data)) throw new Error(`${file} must be a JSON array`);
              data.forEach((e, i) => {
                for (const k of required) if (!e[k]) throw new Error(`${file}[${i}] missing "${k}"`);
                if (!iso.test(e.date)) throw new Error(`${file}[${i}] date must be YYYY-MM or YYYY-MM-DD`);
                if (e.file && !/^https?:/.test(e.file) && !fs.existsSync(e.file))
                  console.log(`::warning::${file}[${i}]: ${e.file} not found`);
                if (JSON.stringify(e).includes("[PLACEHOLDER"))
                  console.log(`::warning::${file}[${i}] is still a placeholder`);
              });
              console.log(`OK: ${file} (${data.length} entries)`);
            };
            check("writeups/writeups.json", ["title", "date", "summary"]);
            check("community.json", ["title", "date", "org"]);
          '

      - name: Warn about leftover TODOs in the page
        run: |
          for f in index.html cv.html; do
            count=$(grep -o "\[TODO" "$f" | wc -l)
            if [ "$count" -gt 0 ]; then echo "::warning::$f still has $count [TODO] placeholder(s)"; fi
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
